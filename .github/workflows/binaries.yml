name: Binaries

# The standalone executables (STUDY-39): every target built (cross-compiled), and the Linux and macOS ones
# run end to end (scripts/smoke-binary.sh), the Linux one on SQLite and on Postgres.

on:
  pull_request:
    paths:
      - "packages/**"
      - "scripts/build-binary.ts"
      - "scripts/smoke-binary.sh"
      - "bun.lock"
      - ".github/workflows/binaries.yml"

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binary.ts --version "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/bin/*.zip
          retention-days: 3

  smoke-linux:
    name: smoke (linux x64, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: bunvex
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binary.ts --target x86_64-unknown-linux-gnu
      - run: scripts/smoke-binary.sh dist/bin/x86_64-unknown-linux-gnu/bunvex
        env:
          SMOKE_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:smoke@127.0.0.1:5432/bunvex' || '' }}

  smoke-macos:
    name: smoke (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binary.ts --host
      - run: scripts/smoke-binary.sh dist/bin/aarch64-apple-darwin/bunvex
