name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each queued PR combined with main and the PRs ahead of it.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the change touches anything but documentation. A docs-only PR (docs/, *.md, .changeset/,
  # LICENSE, NOTICE) still runs the site's tests, which read README.md, ARCHITECTURE.md and docs/; the
  # rest is skipped. Skipped jobs count as passed for the required checks, so the merge queue still
  # gets its statuses (a workflow skipped by `paths-ignore` would never report them). A push to main
  # always runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            merge_group) base="${{ github.event.merge_group.base_sha }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          if printf '%s\n' "$files" | grep -vE '^(docs/|\.changeset/)|\.md$|^(LICENSE|NOTICE)$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: lint · typecheck · dependency rules · tests
    needs: changes
    # Fail safe: if `changes` itself failed, its output is empty and everything runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - if: needs.changes.outputs.code != 'false'
        run: bun run lint
      - if: needs.changes.outputs.code != 'false'
        run: bun run typecheck
      - if: needs.changes.outputs.code != 'false'
        run: bun run check:deps
      # includes PERSIST-01 conformance (K1–K7) on the embedded drivers: memory and SQLite,
      # then the UI packages' suites, each in its own process with a DOM (UI-01 §7)
      - if: needs.changes.outputs.code != 'false'
        run: bun run test
      - if: needs.changes.outputs.code != 'false'
        run: bun run build:dashboard
      - if: needs.changes.outputs.code != 'false'
        run: bun run build:site
      # A docs-only change: the site's tests read the docs (roadmap phases, links to repository files).
      - if: needs.changes.outputs.code == 'false'
        run: bun run --cwd apps/site test

  # Line coverage of the root `bun test`, a table per package and per critical file, and a failure when a
  # critical file drops below its floor (scripts/coverage-floors.ts, TEST-01 §4). Its own job, in parallel
  # with `check`, so the suite's time is not paid twice on the critical path.
  coverage:
    name: coverage · critical-file floors
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run coverage

  # The dashboard in a real browser (UI-01 §12.5.10): Monaco, layout, contrast, reduced motion — what the
  # DOM tests cannot see. Not a required check (yet): the owner decides once it has proved stable.
  e2e:
    name: e2e · dashboard in Chromium
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: install Chromium (the version playwright-core 1.63.0 drives)
        working-directory: apps/dashboard
        run: bun x playwright-core install --with-deps chromium
      - run: bun run e2e
        env:
          E2E_BROWSER: chromium

  # One job per external store, in parallel; `conformance` below keeps the required check's name.
  conformance-postgres:
    name: conformance · Postgres
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: bunvex
          POSTGRES_DB: bunvex_k
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The service container has no TLS, and bunvex requires TLS by default, as Convex (STUDY-25 L8).
      - name: conformance on Postgres
        env:
          DRIVERS: postgres
          KILLS: "4"
          PG_URL: postgres://postgres:bunvex@127.0.0.1:5432/bunvex_k
          DO_NOT_REQUIRE_SSL: "1"
        run: bun run conformance
      - name: TLS defaults on Postgres without TLS (refused by default; DO_NOT_REQUIRE_SSL connects)
        env:
          TLS_PG_PLAIN_URL: postgres://postgres:bunvex@127.0.0.1:5432/bunvex_k
        run: bun test packages/persistence/test/tls-db.test.ts

  conformance-mysql:
    name: conformance · MySQL
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bunvex
          MYSQL_DATABASE: bunvex_k
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -pbunvex" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # MySQL's auto-generated certificates do not verify, and bunvex verifies them by default, as Convex.
      - name: conformance on MySQL
        env:
          DRIVERS: mysql
          KILLS: "4"
          MYSQL_URL: mysql://root:bunvex@127.0.0.1:3306/bunvex_k
          DO_NOT_REQUIRE_SSL: "1"
        run: bun run conformance
      - name: TLS defaults on MySQL with its own certificates (refused by default; DO_NOT_REQUIRE_SSL connects)
        env:
          TLS_MYSQL_URL: mysql://root:bunvex@127.0.0.1:3306/bunvex_k
        run: bun test packages/persistence/test/tls-db.test.ts

  conformance-mongodb:
    name: conformance · MongoDB
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      # bunvex needs MongoDB as a replica set (a flush is a transaction; PERSIST-01 C7). A service container
      # takes no command arguments, so the single-node replica set is started here.
      - name: MongoDB 8, single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for i in $(seq 1 60); do docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 1; done
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: conformance on MongoDB
        env:
          DRIVERS: mongodb
          KILLS: "4"
          MONGO_URL: mongodb://127.0.0.1:27017/bunvex_k?replicaSet=rs0
        run: bun run conformance

  file-storage-s3:
    name: file storage · S3 (RustFS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: s3testkey
      AWS_SECRET_ACCESS_KEY: s3testsecret
      AWS_REGION: us-east-1
    steps:
      # The blob store conformance suite against an S3-compatible store (STUDY-32): RustFS, as minivex's CI
      # (MinIO's images are gone from Docker Hub and quay.io). The bucket is made with the aws CLI; a server
      # that never came up fails here, not later as opaque S3 errors.
      - name: RustFS with an S3 bucket
        run: |
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=s3testkey -e RUSTFS_SECRET_KEY=s3testsecret rustfs/rustfs:1.0.0
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/health/live >/dev/null || { echo "rustfs never became healthy"; exit 1; }
          docker run --rm --network host -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION amazon/aws-cli:2.37.1 --endpoint-url http://127.0.0.1:9000 s3 mb s3://bunvex-test
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: blob store conformance on S3
        env:
          S3_TEST_BUCKET: bunvex-test
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          AWS_S3_FORCE_PATH_STYLE: "true"
        run: bun test packages/file-storage

  conformance:
    name: PERSIST-01 conformance · Postgres · MySQL · MongoDB
    if: always()
    needs: [changes, conformance-postgres, conformance-mysql, conformance-mongodb]
    runs-on: ubuntu-latest
    steps:
      - name: all three stores passed (or a docs-only change)
        run: |
          if [ "${{ needs.changes.outputs.code }}" = false ]; then echo "docs-only change: conformance not needed"; exit 0; fi
          echo "postgres=${{ needs.conformance-postgres.result }} mysql=${{ needs.conformance-mysql.result }} mongodb=${{ needs.conformance-mongodb.result }}"
          test "${{ needs.conformance-postgres.result }}" = success
          test "${{ needs.conformance-mysql.result }}" = success
          test "${{ needs.conformance-mongodb.result }}" = success
