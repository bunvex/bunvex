name: Docker

# The self-hosted image (STUDY-38): built and smoke-tested (docker/smoke.sh, on SQLite and on Postgres) when
# it or what it runs changes. Publishing to ghcr.io is off until the owner turns it on (STUDY-38 K5): set the
# repository variable PUBLISH_IMAGE to "true", and pushes to main publish :latest and :<sha>.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docker/**"
      - "packages/**"
      - "apps/dashboard/**"
      - "bun.lock"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: image smoke test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: docker/smoke.sh (${{ matrix.database }})
        run: docker/smoke.sh
        env:
          SMOKE_POSTGRES: ${{ matrix.database == 'postgres' && '1' || '' }}

  # The dashboard's own image (STUDY-149 PR 7, DV-475): built, brought up beside the backend, and signed in to
  # in Chromium (docker/smoke-dashboard.sh).
  dashboard:
    name: dashboard image smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: install Chromium (the version playwright-core 1.63.0 drives)
        working-directory: apps/dashboard
        run: bun x playwright-core install --with-deps chromium
      - run: docker/smoke-dashboard.sh
        env:
          E2E_BROWSER: chromium

  publish:
    name: publish to ghcr.io
    needs: [smoke, dashboard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bunvex/bunvex-backend:latest
            ghcr.io/bunvex/bunvex-backend:${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dashboard.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bunvex/bunvex-dashboard:latest
            ghcr.io/bunvex/bunvex-dashboard:${{ github.sha }}
